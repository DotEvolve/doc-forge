version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: 'UTC'
    target-branch: dev
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /demo
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: 'UTC'
    target-branch: dev
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: 'UTC'
    target-branch: dev
    open-pull-requests-limit: 3
