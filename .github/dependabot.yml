version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    open-pull-requests-limit: 5
    groups:
      npm-updates:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: npm
    directory: /demo
    schedule:
      interval: monthly
    target-branch: dev
    open-pull-requests-limit: 5
    groups:
      npm-updates:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
